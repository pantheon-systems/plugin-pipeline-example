name: Lint and Test
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  lint-test:
    runs-on: ubuntu-latest
    name: Lint & Test
    env:
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install NPM & Composer dependencies
        run: |
          composer install
          npm install
      - name: Start MySQL
        run: |
          sudo /etc/init.d/mysql start
          mysqladmin -V
      - name: Setup WP-CLI
        uses: godaddy-wordpress/setup-wp-cli@80c9a89bd347082429795c0f12acf567e2c390d4 # 1 2022-10-04T19:52:20Z
      - name: Run linter
        run: composer lint
      - name: Run tests
        run: bash ./bin/phpunit-test.sh
  wporg-code-analysis:
    runs-on: ubuntu-latest
    name: WP.org Code Analysis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: WP.org Code Analysis
        uses: pantheon-systems/action-wporg-validator@a4e56c641359547609152a5b3702f77625282ff2 # v2.0.0
        with:
          type: plugin
  phpcompatibility:
    runs-on: ubuntu-latest
    name: PHP Compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "Note these tests may be incomplete for newer PHP version and miss some deprecations"
        shell: bash
      - name: PHPCompatibility
        # using @dev because PHPCompatibility ^9 does not yet have the
        # sniffers for 8.0+ but main branch does
        uses: pantheon-systems/phpcompatibility-action@bd72eb001d4fb9817c9d6e1a157a71e287f3ff80 # dev 2023-10-04T16:54:18Z
        with:
          test-versions: 8.0-
  validate-readme-spacing:
    name: Validate README Spacing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pantheon-systems/validate-readme-spacing@13c5e619ef5fc39632292f1f5261ab31d1904208 # v1.0.6
        with:
          filepath: 'README.MD'
